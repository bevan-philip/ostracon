# Pushing a version tag (git tag v1.2.0 && git push origin v1.2.0) tests, builds Ostracon.app
# and publishes it as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # The macOS 26 SDK gives the app Liquid Glass; see scripts/build-app.sh.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="${TAG#v}" scripts/build-app.sh

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: ditto -c -k --keepParent build/Ostracon.app "build/Ostracon-$TAG.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" "build/Ostracon-$TAG.zip" \
            --title "Ostracon ${TAG#v}" --generate-notes --verify-tag "${prerelease[@]}"
