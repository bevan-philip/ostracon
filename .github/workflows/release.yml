# Pushing a version tag (git tag v1.2.0 && git push origin v1.2.0) tests, builds Ostracon.app
# and publishes it as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # The code uses SwiftUI API from the macOS 27 SDK, which the macos-26 image's Xcodes lack.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        # Without SDKROOT, xcrun on this image looks for a Command Line Tools SDK that isn't installed.
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: VERSION="${TAG#v}" scripts/build-app.sh

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: ditto -c -k --keepParent build/Ostracon.app "build/Ostracon-$TAG.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" "build/Ostracon-$TAG.zip" \
            --title "Ostracon ${TAG#v}" --generate-notes --verify-tag "${prerelease[@]}"
